<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MBS Serve 测试看板</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local Gateway Check</p>
          <h1>MBS Serve 测试看板</h1>
        </div>
        <div id="overall-status" class="status-badge neutral">未连接</div>
      </header>

      <section class="controls" aria-label="网关配置">
        <label>
          <span>网关地址</span>
          <input id="gateway-url" type="url" value="http://127.0.0.1:7878" autocomplete="off">
        </label>
        <label>
          <span>当前页</span>
          <input id="current-page" type="number" min="1" value="1">
        </label>
        <label>
          <span>每页大小</span>
          <input id="page-size" type="number" min="1" max="200" value="20">
        </label>
        <button id="refresh-button" type="button">刷新检测</button>
      </section>

      <section class="checks" aria-label="连接状态">
        <article class="check-panel">
          <div>
            <h2>路由发现</h2>
            <p id="routes-detail">等待检测</p>
          </div>
          <div id="routes-status" class="status-badge neutral">未连接</div>
        </article>
        <article class="check-panel">
          <div>
            <h2>账号接口</h2>
            <p id="account-detail">等待检测</p>
          </div>
          <div id="account-status" class="status-badge neutral">未连接</div>
        </article>
      </section>

      <section id="error-panel" class="error-panel hidden" aria-live="polite"></section>

      <section class="metrics" aria-label="账号统计">
        <article>
          <span>总记录数</span>
          <strong id="total-count">-</strong>
        </article>
        <article>
          <span>总页数</span>
          <strong id="total-pages">-</strong>
        </article>
        <article>
          <span>当前页</span>
          <strong id="page-current">-</strong>
        </article>
        <article>
          <span>本页条数</span>
          <strong id="page-items">-</strong>
        </article>
      </section>

      <section class="breakdowns" aria-label="聚合统计">
        <article>
          <h2>平台分布</h2>
          <div id="platform-list" class="breakdown-list empty">暂无数据</div>
        </article>
        <article>
          <h2>状态分布</h2>
          <div id="status-list" class="breakdown-list empty">暂无数据</div>
        </article>
        <article>
          <h2>启用状态</h2>
          <div id="enabled-list" class="breakdown-list empty">暂无数据</div>
        </article>
        <article>
          <h2>密码过期</h2>
          <div id="expired-list" class="breakdown-list empty">暂无数据</div>
        </article>
      </section>

      <section class="table-section" aria-label="账号列表">
        <div class="section-header">
          <h2>当前页账号</h2>
          <span id="last-updated">尚未刷新</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>账号编码</th>
                <th>账号</th>
                <th>平台</th>
                <th>状态</th>
                <th>启用</th>
                <th>过期</th>
                <th>更新时间</th>
              </tr>
            </thead>
            <tbody id="account-rows">
              <tr>
                <td colspan="7" class="empty-cell">暂无数据</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
