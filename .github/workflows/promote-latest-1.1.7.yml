name: Promote npm latest to 1.1.7

on:
  push:
    branches:
      - '1.0.0'
    paths:
      - '.github/workflows/promote-latest-1.1.7.yml'

permissions:
  contents: read

jobs:
  promote:
    name: Promote npm latest
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Promote and verify exact published version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          package='@mb-it-org/cli'
          version='1.1.7'

          repository_version=$(node -p "require('./packages/cli/package.json').version")
          published_version=$(npm view "${package}@${version}" version --json)
          maintenance_version=$(npm view "${package}@maintenance-1" version --json)

          test "$repository_version" = "$version"
          test "$published_version" = "\"$version\""
          test "$maintenance_version" = "\"$version\""

          current_latest=$(npm view "${package}@latest" version --json --prefer-online)
          if [ "$current_latest" != "\"$version\"" ]; then
            npm dist-tag add "${package}@${version}" latest
          fi

          for delay in 0 2 4; do
            if [ "$delay" -gt 0 ]; then
              sleep "$delay"
            fi
            latest_version=$(npm view "${package}@latest" version --json --prefer-online)
            if [ "$latest_version" = "\"$version\"" ]; then
              exit 0
            fi
          done

          echo "npm latest did not converge to $version after three checks"
          exit 1
